<p-toast
  [showTransitionOptions]="'250ms'"
  [showTransformOptions]="'translateX(100%)'"
  [hideTransitionOptions]="'150ms'"
  [hideTransformOptions]="'translateX(100%)'"
/>
<div class="flex items-center justify-center min-h-screen overflow-hidden">
  <div class="flex flex-col items-center justify-center">
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--primary-color), transparent 60%) 10%,
          var(--surface-ground) 30%
        );
      "
    >
      <div
        class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20 flex flex-col items-center"
        style="border-radius: 53px"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-30"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.182 16.318A4.486 4.486 0 0 0 12.016 15a4.486 4.486 0 0 0-3.198 1.318M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Z"
          />
        </svg>

        <span class="text-primary font-bold text-3xl">Sesión Duplicada Detectada</span>
        <h3 class="text-surface-900 dark:text-surface-0 font-bold text-3xl lg:text-5xl mb-2">
          Ya has iniciado sesión en otra ubicación.
        </h3>
        <div class="text-surface-600 dark:text-surface-200 mb-8">
          ¿Quieres cerrar la sesión anterior y entrar aquí?
        </div>

        <div class="flex flex-col gap-3 w-full sm:w-80">
          <p-button
            label="Sí, continuar aquí"
            size="large"
            styleClass="!w-full mb-2"
            (onClick)="onCerrarSesionExistente()"
          >
          </p-button>
          <p-button
            label="No, mantener sesión anterior"
            size="large"
            (onClick)="onRedireccionar()"
            styleClass="!w-full p-button-secondary"
          >
          </p-button>
        </div>
      </div>
    </div>
  </div>
</div>

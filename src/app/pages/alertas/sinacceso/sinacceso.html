<div class="flex items-center justify-center min-h-screen overflow-hidden">
  <div class="flex flex-col items-center justify-center">
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--primary-color), transparent 60%) 10%,
          var(--surface-ground) 30%
        );
      "
    >
      <div
        class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20 flex flex-col items-center"
        style="border-radius: 53px"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          stroke="currentColor"
          class="size-30"
        >
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <circle cx="12" cy="6" r="4" stroke="#1C274C" stroke-width="1.5"></circle>
            <path
              d="M15 13.3271C14.0736 13.1162 13.0609 13 12 13C7.58172 13 4 15.0147 4 17.5C4 19.9853 4 22 12 22C17.6874 22 19.3315 20.9817 19.8068 19.5"
              stroke="#1C274C"
              stroke-width="1.5"
            ></path>
            <path
              d="M15.1715 18.8284C15.8954 19.5523 16.8954 20 18 20C20.2091 20 22 18.2091 22 16C22 14.8954 21.5523 13.8954 20.8284 13.1715M15.1715 18.8284C14.4477 18.1045 14 17.1046 14 16C14 13.7909 15.7909 12 18 12C19.1046 12 20.1045 12.4477 20.8284 13.1715M15.1715 18.8284L20.8284 13.1715"
              stroke="#1C274C"
              stroke-width="1.5"
              stroke-linejoin="round"
            ></path>
          </g>
        </svg>
        <span class="text-primary font-bold text-3xl">Acceso denegado</span>
        <h3 class="text-surface-900 dark:text-surface-0 font-bold text-3xl lg:text-5xl mb-2">
          No tienes permisos para ver esta página.
        </h3>
        <div class="text-surface-600 dark:text-surface-200 mb-8 max-w-md text-center">
          Por favor verifica que hayas iniciado sesión correctamente y que tu cuenta tenga los
          privilegios necesarios.
        </div>

        <div class="flex flex-col gap-3 w-full sm:w-80">
          <p-button
            label="Regresar"
            size="large"
            styleClass="!w-full mb-2"
            (onClick)="onRedireccionar()"
          >
          </p-button>
        </div>
      </div>
    </div>
  </div>
</div>

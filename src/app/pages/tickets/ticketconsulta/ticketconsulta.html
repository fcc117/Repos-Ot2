<div class="card">
  <div class="font-semibold text-2xl text-primary mb-5">Filtros de búsqueda</div>
  <div class="flex flex-col gap-6 w-full">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 w-full">
      <div class="w-full">
        <p-floatLabel class="w-full">
          <p-inputNumber
            inputId="txtFolio"
            [(ngModel)]="SelectedFolioValue"
            class="w-full"
            mode="decimal"
            [useGrouping]="false"
            [showClear]="true"
            fluid="true"
          />
          <label for="txtFolio">Folio</label>
        </p-floatLabel>
      </div>
      <div class="w-full">
        <p-floatlabel class="w-full">
          <p-select
            [(ngModel)]="selectedVerTicketsValue"
            [options]="opcionesVerTickets()"
            inputId="selVerTicket"
            optionLabel="name"
            class="w-full"
            emptyFilterMessage="Sin resultados"
            emptyMessage="Sin resultados"
          />
          <label for="selVerTicket">Ver tickets</label>
        </p-floatlabel>
      </div>
      <div class="w-full">
        <p-floatLabel class="w-full">
          <input
            pInputText
            id="txtSolicitante"
            type="text"
            [(ngModel)]="SelectedSolicitanteValue"
            class="w-full"
          />
          <label for="txtSolicitante">Auditor solicitante</label>
        </p-floatLabel>
      </div>
      <div class="w-full">
        <p-floatlabel class="w-full">
          <p-select
            [(ngModel)]="selectedEstatusValue"
            [options]="opcionesEstatus()"
            inputId="selEstatus"
            optionLabel="name"
            class="w-full"
            emptyFilterMessage="Sin resultados"
            emptyMessage="Sin resultados"
            [showClear]="true"
          />
          <label for="selEstatus">Estatus</label>
        </p-floatlabel>
      </div>
      <div class="w-full">
        <p-floatlabel class="w-full">
          <p-select
            [(ngModel)]="selectedAreaValue"
            [options]="opcionesArea()"
            inputId="selArea"
            optionLabel="name"
            class="w-full"
            emptyFilterMessage="Sin resultados"
            emptyMessage="Sin resultados"
            [showClear]="true"
          />
          <label for="selArea">Área</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 w-full">
      <div class="w-full">
        <p-floatLabel class="w-full">
          <p-select
            [(ngModel)]="selectedRangoAntiguedadValue"
            [options]="opcionesRangoAntiguedad()"
            inputId="selRangoAntiguedad"
            optionLabel="name"
            class="w-full"
            emptyFilterMessage="Sin resultados"
            emptyMessage="Sin resultados"
            [showClear]="true"
          />
          <label for="selRangoAntiguedad">Antigüedad</label>
        </p-floatLabel>
      </div>
      @if(selectedRangoAntiguedadValue()){
      <div class="w-full">
        <p-floatLabel class="w-full">
          <p-inputNumber
            inputId="txtAntiguedad"
            [(ngModel)]="selectedAntiguedadValue"
            mode="decimal"
            [useGrouping]="false"
            [showClear]="true"
            fluid="true"
          />
          <label for="txtAntiguedad">Días</label>
        </p-floatLabel>
      </div>
      }
      <div class="col-span-2">
        <p-floatLabel class="w-full">
          <p-datepicker
            [(ngModel)]="selectedFechaRegistroValue"
            [readonlyInput]="true"
            showIcon
            iconDisplay="input"
            styleClass=" w-full"
            inputId="fechaRegistro"
            selectionMode="range"
            inputStyleClass="w-full"
            [showClear]="true"
          />
          <label for="fechaRegistro">Fecha de registro (Desde: Hasta:)</label>
        </p-floatLabel>
      </div>

      <div class="col-span-2">
        <p-floatLabel class="w-full">
          <p-datepicker
            [(ngModel)]="selectedFechaCierreValue"
            [readonlyInput]="true"
            showIcon
            iconDisplay="input"
            styleClass=" w-full"
            inputId="fechaCierre"
            selectionMode="range"
            inputStyleClass="w-full"
            [showClear]="true"
          />
          <label for="fechaCierre">Fecha de cierre (Desde: Hasta:)</label>
        </p-floatLabel>
      </div>
    </div>
    <div class="flex justify-end w-full">
      <p-button
        icon="pi pi-search"
        label="Aplicar filtros"
        styleClass="text-primarymin-w-40 m-2"
        (onClick)="onConsultaTickets()"
      />
      <p-button
        icon="pi pi-eraser"
        label="Borrar filtros"
        styleClass="text-primarymin-w-40 m-2"
        (onClick)="limpiarCampos()"
      />
    </div>
  </div>
</div>

@if(arrTickets().length > 0){
<div class="card">
  <div class="font-semibold text-2xl text-primary mb-5">Resultados de búsqueda</div>
  <div class="font-semibold text-primary mb-5">{{ totalTickets() }} Tickets encontrados</div>
  <p-table
    [value]="arrTickets()"
    [tableStyle]="{ 'min-width': '50rem' }"
    [rows]="100"
    [paginator]="true"
    [globalFilterFields]="[
      'folio',
      'antiguedad_calculada',
      'asignacion_calculada',
      'solicitud_calculada'
    ]"
    stripedRows
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="folio" style="width: 10%">
          <div class="flex items-center gap-2">
            Folio
            <p-sortIcon field="folio" />
          </div>
        </th>
        <th style="width: 5%">
          <div class="flex items-center gap-2">Estatus</div>
        </th>
        <th pSortableColumn="antiguedad_calculada" style="width: 15%">
          <div class="flex items-center gap-2">
            Antigüedad
            <p-sortIcon field="antiguedad_calculada" />
          </div>
        </th>
        <th pSortableColumn="asignacion_calculada" style="width: 15%">
          <div class="flex items-center gap-2">
            En asignación
            <p-sortIcon field="asignacion_calculada" />
          </div>
        </th>
        <th pSortableColumn="solicitud_calculada" style="width: 50%">
          <div class="flex items-center gap-2">
            Tipo de solicitud
            <p-sortIcon field="solicitud_calculada" />
          </div>
        </th>
        <th style="width: 5%"></th>
      </tr>
      <tr>
        <th>
          <p-columnFilter
            id="filterFolio"
            type="text"
            field="folio"
            placeholder="Buscar folio"
            showMenu="false"
            filterOn="input"
          ></p-columnFilter>
        </th>
        <th></th>
        <th>
          <p-columnFilter
            id="filterAntiguedad"
            type="text"
            field="antiguedad_calculada"
            placeholder="Buscar antigüedad"
            showMenu="false"
            filterOn="input"
          ></p-columnFilter>
        </th>
        <th>
          <p-columnFilter
            id="filterAsignacion"
            type="text"
            field="asignacion_calculada"
            placeholder="Buscar asignación"
            showMenu="false"
            filterOn="input"
          ></p-columnFilter>
        </th>
        <th>
          <p-columnFilter
            id="filterSolicitud"
            type="text"
            field="solicitud_calculada"
            placeholder="Buscar solicitud"
            showMenu="false"
            filterOn="input"
          ></p-columnFilter>
        </th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-ticket>
      <tr>
        <td>
          <span class="text-shadow-black font-bold">{{ ticket.folio }}</span>
        </td>
        <td>
          <i pTooltip="{{ ticket.estatus }}" [ngClass]="obtenerEstatusColor(ticket.id_estatus)"></i>
        </td>
        <td>{{ ticket.antiguedad_calculada }}</td>
        <td>{{ ticket.asignacion_calculada }}</td>
        <td [innerHTML]="ticket.solicitud_calculada"></td>
        <td>
          <i
            pTooltip="Detalle"
            tooltipPosition="top"
            class="pi pi-receipt !text-2xl"
            (click)="irDetalle(ticket.folio)"
          ></i>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
}
<p-confirmDialog [position]="'top'"></p-confirmDialog>
